/**:
  ros__parameters:
    # --- 既存の項目 ---
    max_range: 30.0
    downsample_num: 1080
    ckpt_path: "ppo_model.zip" # SB3は基本 .zip です
    state_dim: 1080
    action_dim: 2
    
    # --- SB3/実機向けに追加したい項目 ---
    deterministic: true          # 推論時に「常に最善の行動」をとるか（実機では通常 true）
    steering_offset: 0.0         # 実機のステアリングの物理的なズレを補正する値
    min_speed: 0.0               # AIが低速を出しすぎてスタックするのを防ぐ最低速度
    max_speed: 5.0               # ゲインとは別に、安全のために物理的な限界速度を制限